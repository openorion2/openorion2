# What CI can check without the original game's files, on Linux alone: the
# build for every release platform (cross-compiled) and the browser, vet,
# formatting, and the tests that do not need them (those that do skip
# without game/), under -race. Other systems are tested locally.
# Not for changes of the docs alone (tags always run: GitHub does not apply
# path filters to them); a newer push cancels the run of an older one.
name: CI
on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: The browser build
        run: GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/openorion2
      - name: The release platforms
        run: |
          for p in darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            GOOS=${p%/*} GOARCH=${p#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/openorion2 || exit 1
          done
      - name: The training simulator (tag aitrain)
        run: go vet -tags aitrain ./internal/game ./tools/aitrain
      - name: Tests (race)
        run: go test -race ./...
